name: Research cars
on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 6-7 AM New York
  push:
    branches: [main]
    paths: [data/cars.json]
  workflow_dispatch:
    inputs:
      car:
        description: "Car id (blank = all cars)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      # A run that waited behind another starts from the latest main, not the commit that triggered it,
      # so it sees the finds the earlier run saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research.py ${{ github.event.inputs.car }}
      - name: Commit new finds
        run: |
          git config user.name "car-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet && exit 0
          git commit -m "research $(date -u +%F)"
          if ! git pull --rebase origin main; then
            # articles.json changed while we searched: search again on top of the latest copy
            # (research only ever adds finds, so nothing is lost)
            git rebase --abort
            git reset --hard origin/main
            python research.py ${{ github.event.inputs.car }}
            git add data/articles.json
            git diff --cached --quiet && exit 0
            git commit -m "research $(date -u +%F)"
          fi
          git push
