name: Research cars
on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 6-7 AM New York
  push:
    branches: [main]
    paths: [data/cars.json]
  workflow_dispatch:
    inputs:
      car:
        description: "Car id (blank = all cars)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research.py ${{ github.event.inputs.car }}
      - name: Commit new finds
        run: |
          git config user.name "car-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet && exit 0
          git commit -m "research $(date -u +%F)"
          git pull --rebase origin main
          git push
